services:
  - type: web
    name: synapse-voice-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: |
      sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      pip install --upgrade pip
      pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://synapse-park.vercel.app,https://synapse-1-0.vercel.app,http://localhost:3000
