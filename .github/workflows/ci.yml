name: Synapse-Voice CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Lint, Typecheck & Test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install System Audio Libraries
        run: |
          sudo apt-get update -y --fix-missing || true
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r backend/requirements.txt
          python -m pip install ruff mypy pytest httpx

      - name: Run Ruff Linting
        run: python -m ruff check backend ml

      - name: Run Mypy Typecheck
        run: python -m mypy backend/app ml/src --ignore-missing-imports

      - name: Run Pytest Suite
        run: |
          python -m pytest backend/tests ml/tests -v --tb=short -p no:cacheprovider --import-mode=importlib

  frontend-checks:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Run TypeScript Check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        working-directory: ./frontend
        run: npx vitest run

      - name: Build Next.js App
        working-directory: ./frontend
        run: npm run build
