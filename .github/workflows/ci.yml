name: Synapse-Voice CI

on:
  push:
    branches: [ main, phase-* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Audio Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest httpx

      - name: Run Ruff Linting
        run: |
          python -m ruff check backend ml

      - name: Run Mypy Typecheck
        run: |
          python -m mypy backend/app ml/src --ignore-missing-imports

      - name: Run Pytest Suite
        run: |
          python -m pytest backend/tests ml/tests -v

  frontend-checks:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Run TypeScript Check
        working-directory: ./frontend
        run: npm run typecheck || npx tsc --noEmit

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint || true

      - name: Build Next.js App
        working-directory: ./frontend
        run: npm run build
